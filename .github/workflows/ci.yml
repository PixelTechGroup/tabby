name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test, lint and typings (Node 22)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y libfontconfig1-dev libsecret-1-dev
          npm i -g yarn@1.22.22
          cd app
          yarn install --frozen-lockfile --network-timeout 1000000
          cd ..
          rm app/node_modules/.yarn-integrity
          yarn install --frozen-lockfile --network-timeout 1000000

      - name: SSH regression tests
        run: yarn run test:ssh-term

      - name: Config Sync regression tests
        run: yarn run test:config-sync

      - name: Unit tests
        run: yarn run test:unit

      - name: Build typings
        run: yarn run build:typings

      - name: Lint
        run: yarn run lint
