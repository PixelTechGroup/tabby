name: Package-Build

# Manual, on-demand packaging only (workflow_dispatch). This workflow never
# publishes and never triggers on pushes, pull requests, or tags.
#
# Supported internal build targets:
#   - Linux x64
#   - Windows x64
#   - macOS arm64 (Apple Silicon)
#
# Signing policy: internal builds are unsigned by default. macOS is unsigned
# and unnotarized, Windows is unsigned, and Linux packages are unsigned.
# Signing can be re-enabled per run with the "sign" input via the existing
# electron-builder signing tooling; no signing source code has been removed.
# Notarization is disabled unconditionally for internal PixelTech builds.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        type: choice
        default: 'linux'
        options:
          - linux
          - macos
          - windows
          - all
      sign:
        description: 'Sign the build (requires signing secrets). Default off: macOS unsigned, Windows unsigned, Linux unsigned. Notarization is always disabled.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: package-build-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  macOS-Build:
    if: inputs.platform == 'macos' || inputs.platform == 'all'
    runs-on: macos-15
    strategy:
      matrix:
        include:
          - arch: arm64
            rust_triple: aarch64-apple-darwin
      fail-fast: false

    env:
      ARCH: ${{matrix.arch}}
      RUST_TARGET_TRIPLE: ${{matrix.rust_triple}}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Installing Node
      uses: actions/setup-node@v4.4.0
      with:
        node-version: 22.22.3

    - run: rustup target add ${{matrix.rust_triple}}

    - name: Install deps
      run: |
        yarn install --frozen-lockfile --network-timeout 1000000
      env:
        ARCH: ${{matrix.arch}}

    - name: Webpack
      run: yarn run build

    - name: Prepackage plugins
      run: scripts/prepackage-plugins.mjs
      env:
        ARCH: ${{matrix.arch}}

    - run: sed -i '' 's/updateInfo = await/\/\/updateInfo = await/g' node_modules/app-builder-lib/out/targets/ArchiveTarget.js

    # Work around electron-builder beta bug
    - run: ln -s ../../node_modules/electron app/node_modules

    - name: Build and sign packages
      run: scripts/build-macos.mjs
      if: inputs.sign == true
      env:
        ARCH: ${{matrix.arch}}
        CSC_LINK: ${{ secrets.CSC_LINK }}
        CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        USE_HARD_LINKS: false
        # DEBUG: electron-builder,electron-builder:*

    - name: Build packages without signing
      run: scripts/build-macos.mjs
      if: inputs.sign == false
      env:
        ARCH: ${{matrix.arch}}
        # DEBUG: electron-builder,electron-builder:*


    - name: Package artifacts
      run: |
        mkdir artifact-dmg
        mv dist/*.dmg artifact-dmg/
        mkdir artifact-zip
        mv dist/*.zip artifact-zip/

    - uses: actions/upload-artifact@v4
      name: Upload DMG
      with:
        name: macOS .dmg (${{matrix.arch}})
        path: artifact-dmg
        if-no-files-found: error

    - uses: actions/upload-artifact@v4
      name: Upload ZIP
      with:
        name: macOS .zip (${{matrix.arch}})
        path: artifact-zip
        if-no-files-found: error

  Linux-Build:
    if: inputs.platform == 'linux' || inputs.platform == 'all'
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        include:
          - build-arch: x64
            arch: amd64
            rust_triple: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
      fail-fast: false

    env:
      ARCH: ${{matrix.build-arch}}
      npm_config_arch: ${{matrix.build-arch}}
      npm_config_target_arch: ${{matrix.build-arch}}
      RUST_TARGET_TRIPLE: ${{matrix.rust_triple}}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Install Node
      uses: actions/setup-node@v4.4.0
      with:
        node-version: 22.22.3

    - name: Install FPM
      run: |
        sudo gem install fpm

    - run: rustup target add ${{matrix.rust_triple}}

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y \
          build-essential python3 cmake libfontconfig1-dev libsecret-1-dev libarchive-tools zsh

    - name: Install npm_modules (native)
      run: |
        npm i -g yarn@1.22.22
        yarn install --frozen-lockfile --network-timeout 1000000

    - name: Webpack (${{matrix.arch}})
      run: yarn run build

    - name: Prepackage plugins (${{matrix.arch}})
      run: scripts/prepackage-plugins.mjs

    - name: Build packages (${{matrix.arch}})
      run: scripts/build-linux.mjs
      env:
        USE_HARD_LINKS: false
        USE_SYSTEM_FPM: true
        # DEBUG: electron-builder,electron-builder:*

    - name: Build web resources (amd64 only)
      run: zsh -c 'tar czf tabby-web.tar.gz (tabby-*|web)/dist'
      if: matrix.build-arch == 'x64'

    - uses: actions/upload-artifact@v4
      name: Upload AppImage (${{matrix.arch}})
      with:
        name: Linux AppImage (${{matrix.arch}})
        path: dist/*.AppImage
        if-no-files-found: error

    - uses: actions/upload-artifact@v4
      name: Upload DEB (${{matrix.arch}})
      with:
        name: Linux DEB (${{matrix.arch}})
        path: dist/*.deb
        if-no-files-found: error

    - uses: actions/upload-artifact@v4
      name: Upload RPM (${{matrix.arch}})
      with:
        name: Linux RPM (${{matrix.arch}})
        path: dist/*.rpm
        if-no-files-found: error

    - uses: actions/upload-artifact@v4
      name: Upload Pacman Package (${{matrix.arch}})
      with:
        name: Linux Pacman (${{matrix.arch}})
        path: dist/*.pacman
        if-no-files-found: error

    - uses: actions/upload-artifact@v4
      name: Upload Linux tarball (${{matrix.arch}})
      with:
        name: Linux tarball (${{matrix.arch}})
        path: dist/*.tar.gz
        if-no-files-found: error

    - uses: actions/upload-artifact@v4
      name: Upload web tarball (amd64 only)
      with:
        name: Web tarball
        path: tabby-web.tar.gz
        if-no-files-found: error
      if: matrix.build-arch == 'x64'

  Windows-Build:
    if: inputs.platform == 'windows' || inputs.platform == 'all'
    runs-on: windows-2022
    strategy:
      matrix:
        include:
          - arch: x64
            rust_triple: x86_64-pc-windows-msvc
      fail-fast: false

    env:
      RUST_TARGET_TRIPLE: ${{matrix.rust_triple}}
      ARCH: ${{matrix.arch}}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Add Windows SDK signtool to PATH
      shell: powershell
      run: |
        $x64 = 'C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64'
        $newPath = "$x64;$env:PATH"
        echo "PATH=$newPath" >> $env:GITHUB_ENV

    - name: Decode certificate
      if: inputs.sign == true
      env:
        SM_CLIENT_CERT_FILE_B64: ${{ secrets.SM_CLIENT_CERT_FILE_B64 }}
      run: |
        SM_CLIENT_CERT_FILE="$RUNNER_TEMP/certificate.p12"
        echo "$SM_CLIENT_CERT_FILE_B64" | base64 --decode > "$SM_CLIENT_CERT_FILE"
        echo "SM_CLIENT_CERT_FILE=$SM_CLIENT_CERT_FILE" >> "$GITHUB_ENV"
      shell: bash

    - name: Setup Software Trust Manager
      if: inputs.sign == true
      uses: digicert/code-signing-software-trust-action@cb502242630f8556eb815a4f9c1e8c64d2a2d2a3 # v1.0.0
      env:
        SM_HOST: ${{ vars.SM_HOST }}
        SM_API_KEY: ${{ secrets.SM_API_KEY }}
        SM_CLIENT_CERT_FILE: ${{ env.SM_CLIENT_CERT_FILE }}
        SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}

    - name: smctl diagnostics
      if: inputs.sign == true
      shell: powershell
      env:
        SM_LOG_LEVEL: TRACE
        SM_API_KEY: ${{ secrets.SM_API_KEY }}
        SM_HOST: ${{ vars.SM_HOST }}
        SM_KEYPAIR_ALIAS: ${{ vars.SM_KEYPAIR_ALIAS }}
        SM_CODE_SIGNING_CERT_SHA1_HASH: ${{ vars.SM_CODE_SIGNING_CERT_SHA1_HASH }}
        SM_CLIENT_CERT_FILE: ${{ env.SM_CLIENT_CERT_FILE }}
        SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
      run: |
        Write-Host "=== smctl version ==="
        smctl.exe --version

        Write-Host "=== smctl healthcheck ==="
        smctl.exe healthcheck

        Write-Host "=== smctl healthcheck --tools ==="
        smctl.exe healthcheck --tools

        Write-Host "=== smctl keypair ls ==="
        smctl.exe keypair ls

        Write-Host "=== smctl certificate ls ==="
        smctl.exe certificate ls

        Write-Host "=== Windows SDK signtool path(s) ==="
        Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits" -Filter "signtool.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName

    - name: Installing Node
      uses: actions/setup-node@v4.4.0
      with:
        node-version: 22.22.3

    - run: rustup target add ${{matrix.rust_triple}}

    - name: Download Visual C++ Redistributable
      shell: bash
      run: |
        curl -sSL -o build/vc_redist.exe "https://aka.ms/vs/17/release/vc_redist.x64.exe"
        ls -la build/vc_redist.exe
    - name: Build UAC helper
      shell: powershell
      run: |
        # extras/UAC.exe used to be a checked-in prebuilt, so source fixes never shipped.
        # The solution has no ARM64 config; the x64 binary runs under emulation on ARM64.
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
        if (-not $msbuild) { throw "MSBuild not found" }

        # The project pins VS2017 (v141) and SDK 10.0.17763; retarget to whatever the runner has.
        & $msbuild tabby-uac\UAC.sln `
          /p:Configuration=Release `
          /p:Platform=x64 `
          /p:PlatformToolset=v143 `
          /p:WindowsTargetPlatformVersion=10.0 `
          /verbosity:minimal
        if ($LASTEXITCODE -ne 0) { throw "UAC build failed" }

        # don't hardcode MSBuild's output layout
        $built = Get-ChildItem tabby-uac -Recurse -Filter UAC.exe |
          Where-Object { $_.FullName -match '\\Release\\' } |
          Sort-Object LastWriteTime -Descending | Select-Object -First 1
        if (-not $built) { throw "UAC.exe not found after build" }
        Copy-Item $built.FullName extras\UAC.exe -Force
        Get-Item extras\UAC.exe | Format-List FullName, Length, LastWriteTime

    - name: Build
      shell: powershell
      run: |
        npm i -g yarn@1.22.22
        yarn install --frozen-lockfile --network-timeout 1000000
        yarn run build
        node scripts/prepackage-plugins.mjs
      env:
        ARCH: ${{matrix.arch}}

    - name: Build packages without signing
      run: node scripts/build-windows.mjs
      if: inputs.sign == false
      env:
        ARCH: ${{matrix.arch}}

    - name: Build and sign packages
      if: inputs.sign == true
      shell: powershell
      run: |
        Get-FileHash $env:SM_CLIENT_CERT_FILE -Algorithm MD5
        smksp_registrar.exe list
        smctl.exe healthcheck
        smctl.exe keypair ls
        smctl windows certsync --keypair-alias $env:SM_KEYPAIR_ALIAS
        smctl.exe certificate ls
        C:\Windows\System32\certutil.exe -csp "DigiCert Signing Manager KSP" -key -user
        smksp_cert_sync.exe

        signtool.exe sign /sha1 $env:SM_CODE_SIGNING_CERT_SHA1_HASH `
          /tr http://timestamp.digicert.com /td SHA256 /fd SHA256 `
          extras\UAC.exe
        if ($LASTEXITCODE -ne 0) { throw "UAC.exe signing failed" }
        signtool.exe verify /pa extras\UAC.exe

        # not used but necessary for electron-builder to run
        $env:WIN_CSC_LINK=$env:SM_CLIENT_CERT_FILE
        $env:WIN_CSC_KEY_PASSWORD=$env:SM_CLIENT_CERT_PASSWORD

        node scripts/build-windows.mjs
      env:
        ARCH: ${{matrix.arch}}
        SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
        SM_PUBLISHER_NAME: ${{ secrets.SM_PUBLISHER_NAME }}
        SM_API_KEY: ${{ secrets.SM_API_KEY }}
        SM_HOST: ${{ vars.SM_HOST }}
        SM_CODE_SIGNING_CERT_SHA1_HASH: ${{ vars.SM_CODE_SIGNING_CERT_SHA1_HASH }}
        SM_KEYPAIR_ALIAS: ${{ vars.SM_KEYPAIR_ALIAS }}
        SM_LOG_LEVEL: TRACE
        # DEBUG: electron-builder,electron-builder:*


    - name: Add VC Runtime to portable zip
      shell: powershell
      env:
        ARCH: ${{matrix.arch}}
      run: |
        # Copy VC Runtime DLLs from Visual Studio
        mkdir "vc-runtime" -Force | Out-Null

        $arch = "x64"
        $crtDir = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\*\VC\Redist\MSVC\*\$arch\Microsoft.VC*.CRT" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($crtDir) {
          @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll") | ForEach-Object {
            $src = Join-Path $crtDir.FullName $_
            if (Test-Path $src) {
              Copy-Item $src "vc-runtime/"
              Write-Host "Copied $_ from $src"
            }
          }
        }

        # Add VC Runtime DLLs to portable zip
        $portableZip = Get-ChildItem dist/*-portable-*.zip | Select-Object -First 1
        if ($portableZip) {
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          # Open zip in update mode and add DLL files
          $zip = [System.IO.Compression.ZipFile]::Open($portableZip.FullName, [System.IO.Compression.ZipArchiveMode]::Update)
          Get-ChildItem "vc-runtime" -Filter "*.dll" | ForEach-Object {
            [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile($zip, $_.FullName, $_.Name) | Out-Null
            Write-Host "Added $($_.Name) to portable zip"
          }
          $zip.Dispose()
          Write-Host "Portable zip updated with VC Runtime"
        }

    - name: Package artifacts
      run: |
        mkdir artifact-setup
        mv dist/*-setup-*.exe artifact-setup/
        mkdir artifact-portable
        mv dist/*-portable-*.zip artifact-portable/

    - uses: actions/upload-artifact@v4
      name: Upload installer
      with:
        name: Windows installer (${{matrix.arch}})
        path: artifact-setup
        if-no-files-found: error

    - uses: actions/upload-artifact@v4
      name: Upload portable build
      with:
        name: Windows portable build (${{matrix.arch}})
        path: artifact-portable
        if-no-files-found: error
